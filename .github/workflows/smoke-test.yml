name: FinelyBD source smoke tests
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify local navigation and PWA files
        run: python tests/check_site.py
